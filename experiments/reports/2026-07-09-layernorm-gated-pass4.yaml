  interpretation: >
    `t3/layernorm_gated` is correctness-positive and performance-positive.
    Preserving fp16 intermediate rounding and grouping rows per Triton program
    produced the best T3 pre-key normalization result so far.
notes: >
  The first fp32-heavy Triton attempt failed official correctness with
  `max_abs_diff=0.01171875`; switching to `tl.sigmoid` was insufficient by
  itself. Matching PyTorch NPU's fp16 intermediate behavior at square/mean,
  rsqrt, sigmoid, and multiply stages made the 4096-wide row kernel exact on
  probes and official trials. Chunked 2048x2 and 1024x4 reductions still failed
  full-shape correctness, so v3/v4 were repaired as 2-row and 4-row grouped
  kernels that preserve the single-row reduction order.
