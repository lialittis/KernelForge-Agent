notes: >
  Initial Triton probes using fp16 arithmetic matched by absolute tolerance
  but exceeded the official max-relative-error gate near zero-valued outputs.
  Casting x, cos, sin, and the rotated partner to float32 before the fused
  multiply-add matched `torch_npu.npu_rotary_mul` exactly on the probe and
  official benchmark trials. Benchmark ran on the updated standalone AKG runner
  with CANN's Python paths preserved by
  `export PYTHONPATH=/data/KernelForge-Agent:${PYTHONPATH:-}` after sourcing
  `set_env.sh`.
