akg_agents_runner:
  path: third_party/akg/akg_agents/examples/kernel_related/run_torch_bench_lite.py
  status: blocked_pre_key_environment
  input_contract: >
    Agent orchestration runner. `--submission-dir` is an output directory for
    extracted successful Agent attempts, not an input directory for
    pre-existing replay/manual submissions.
  attempted_command: >
    source /usr/local/Ascend/ascend-toolkit/set_env.sh &&
    source /data/venvs/kf-triton-ascend/bin/activate &&
    export PYTHONPATH=/data/KernelForge-Agent:/data/KernelForge-Agent/third_party/akg/akg_agents/python:${PYTHONPATH:-} &&
    python third_party/akg/akg_agents/examples/kernel_related/run_torch_bench_lite.py --help
  failure:
    category: environment_error
    module: langchain_core
    message: "ModuleNotFoundError: No module named 'langchain_core'"
  result_schema: >
    Not produced in the current environment. `RUNNER.md` specifies a single
    JSON artifact with top-level `summary`, `results`, and, in performance/full
    modes, `performance_results` and `performance_summary`.

decision:
  current_authoritative_pre_key_runner: standalone_tools_run_bench_py
  rationale: >
    The standalone runner directly evaluates existing replay/manual
    submissions, is runnable in the current Ascend venv, and produced complete
    correctness/performance JSON. The AKG Agents runner is the future
    orchestration path for live Agent generation, but it currently requires the
    broader AKG Agents dependency stack and provider/agent configuration before
    it can produce comparable Pass@N and performance artifacts.
  follow_up: >
    After installing the AKG Agents runtime dependencies and configuring a live
    provider, rerun `run_torch_bench_lite.py --backend npu --mode full --cases
    sigmoid_scale_sum --pass-n 4` and compare its extracted submissions and
    performance schema against the standalone scorer.

