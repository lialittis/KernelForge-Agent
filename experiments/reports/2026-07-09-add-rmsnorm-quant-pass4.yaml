  interpretation: >
    The reference candidate reproduces the current baseline, but the pure
    Triton-Ascend quantized variants are correctness-negative under the
    official max-absolute-error gate. The failure mode is one-int8 boundary
    differences after RMSNorm, scalar quantization, and int8 clamp.
notes: >
  Triton-Ascend 3.2.0 does not expose `tl.round`, so the Triton candidates used
  `floor(x + 0.5)` after the RMSNorm and scalar quantization expression. Small
  probes sometimes matched exactly, but the official full-shape correctness
  trials failed all Triton variants on seed 0 with `max_abs_diff=1`. Treat this
  as a negative quantized-normalization lesson before live provider generation:
  exact int8 quantization needs either a reliable backend rounding primitive, a
  safe framework quantization fallback, or a different backend strategy.
