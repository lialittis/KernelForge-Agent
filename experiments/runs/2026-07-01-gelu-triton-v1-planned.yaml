notes: >
  First custom candidate uses exact erf-form GELU. It falls back to PyTorch GELU
  if Triton, tl.erf, or the NPU launch path is unavailable. On 2026-07-01 the
  official benchmark passed with speedup 1.0176x and weighted score 60.18. The
  follow-up probe confirmed this was PyTorch fallback, caused by Triton runtime
  reporting zero active drivers.

