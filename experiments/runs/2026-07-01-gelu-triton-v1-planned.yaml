  profiles: null

notes: >
  First custom candidate uses exact erf-form GELU. It falls back to PyTorch GELU
  if Triton, tl.erf, or the NPU launch path is unavailable. On 2026-07-01 the
  official benchmark passed with speedup 1.0176x and weighted score 60.18. The
  follow-up probe confirmed this was PyTorch fallback, caused by Triton runtime
  reporting zero active drivers. The diagnostic confirmed the root cause is a
  missing Triton-Ascend backend package. After installing Triton-Ascend in a
  venv, v1 launched through Triton but failed the official benchmark with
  max_abs_diff 4.737377e-04 and max_rel_diff 4.803681e+00.

next:
  - Test gelu_triton_v2, which uses erfc form to avoid negative-tail cancellation.
  - If v2 still fails, design a benchmark-safe exact GELU strategy for near-zero outputs.
