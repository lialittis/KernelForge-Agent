  torch_version: "2.9.0+cpu"
  torch_npu_version: "2.9.0rc1"
  venv: /data/venvs/kf-triton-ascend

diagnosis:
  initial_error: "ModuleNotFoundError: No module named 'tbe'"
  initial_failed_result: outputs/results/remaining_reference_2026_07_09/reference_t3_causal_conv1d.json
  root_cause: >
    The failed benchmark invocation set `PYTHONPATH=/data/KernelForge-Agent`
    for the Python process after sourcing CANN `set_env.sh`, which discarded
    the CANN Python paths needed by the ACL/TBE compile path.
  existing_tbe_location: /usr/local/Ascend/cann-8.5.1/python/site-packages/tbe
  existing_te_location: /usr/local/Ascend/cann-8.5.1/python/site-packages/te
  existing_auto_tune_location: /usr/local/Ascend/cann-8.5.1/python/site-packages/auto_tune
  fix: >
    Source `/usr/local/Ascend/ascend-toolkit/set_env.sh`, activate the
    benchmark venv, then prepend the repository path with
    `export PYTHONPATH=/data/KernelForge-Agent:${PYTHONPATH:-}`.

commands:
  check_imports: >
    source /usr/local/Ascend/ascend-toolkit/set_env.sh &&
    source /data/venvs/kf-triton-ascend/bin/activate &&
    python -c "import importlib.util; print(importlib.util.find_spec('tbe')); print(importlib.util.find_spec('te')); print(importlib.util.find_spec('auto_tune'))"
  benchmark_fixed: >
    source /usr/local/Ascend/ascend-toolkit/set_env.sh &&
    source /data/venvs/kf-triton-ascend/bin/activate &&
    export PYTHONPATH=/data/KernelForge-Agent:${PYTHONPATH:-} &&
    python third_party/akg/akg_agents/benchmark/akg_kernels_bench_lite/tools/run_bench.py
    outputs/submissions/remaining_reference_2026_07_09
    --team reference_t3_causal_conv1d
    --bench-dir third_party/akg/akg_agents/benchmark/akg_kernels_bench_lite
    --output outputs/results/causal_conv1d_envfix_2026_07_09
    --warmup 10
    --iterations 100
    --num-trials 3

result:
  team_name: reference_t3_causal_conv1d
