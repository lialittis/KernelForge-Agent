notes: >
  Deterministic pre-evaluation batch for the 9 AKG Bench Lite cases that had
  not yet received a reference candidate in this repository. Eight cases passed
  the official benchmark. `t3/causal_conv1d` failed in the official reference
  path due missing CANN/TBE Python module support for the NPU conv1d compile
  path, so it is an environment/runtime failure rather than a candidate
  correctness failure.

next:
  - Fix or document the CANN/TBE environment gap for `t3/causal_conv1d`.
  - Add parser support for symbolic shape variables so these reference results
    can be tied to full OpSpec records.
  - Use the passed reference measurements as pre-AI baselines for provider
    generated candidates.
