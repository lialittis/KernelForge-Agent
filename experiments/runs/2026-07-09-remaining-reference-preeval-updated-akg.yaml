    source /usr/local/Ascend/ascend-toolkit/set_env.sh &&
    source /data/venvs/kf-triton-ascend/bin/activate &&
    export PYTHONPATH=/data/KernelForge-Agent:${PYTHONPATH:-} &&
    python /data/KernelForge-Agent/third_party/akg/akg_agents/benchmark/akg_kernels_bench_lite/tools/run_bench.py
