      `/usr/local/Ascend/cann-8.5.1/opp/built-in/op_impl/ai_core/tbe` from
      the Python import path.
    fix: >
      Source `set_env.sh`, activate the benchmark venv, then prepend the
      repository path with `export PYTHONPATH=/data/KernelForge-Agent:${PYTHONPATH:-}`.
    evidence: >
      After `set_env.sh`, Python found `tbe`, `te`, and `auto_tune` under
      `/usr/local/Ascend/cann-8.5.1/python/site-packages`. The corrected
      single-case benchmark passed.
