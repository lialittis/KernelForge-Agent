  diagnose_tbe_import: >
    source /usr/local/Ascend/ascend-toolkit/set_env.sh &&
    source /data/venvs/kf-triton-ascend/bin/activate &&
    python -c "import importlib.util; print(importlib.util.find_spec('tbe'))"
