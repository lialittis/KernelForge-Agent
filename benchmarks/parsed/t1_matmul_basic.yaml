id: t1/matmul_basic
name: matmul_basic
tier: t1
category: matmul_like
source_path: third_party/akg/akg_agents/benchmark/akg_kernels_bench_lite/t1/matmul_basic.py
reference_class: Model
candidate_class: ModelNew
inputs:
- name: a
  shape:
  - 32
  - 8192
  dtype: bfloat16
  layout: contiguous
- name: b
  shape:
  - 8192
  - 8192
  dtype: bfloat16
  layout: contiguous
outputs:
- name: output
  shape:
  - 32
  - 8192
  dtype: bfloat16
  layout: contiguous
semantics:
  expression: torch.matmul(a, b)
  formula: C[m, n] = sum_k A[m, k] * B[k, n]
  broadcast: none
  reduction_axes:
  - K
  normalization_axes: []
  layout_transform: none
  accumulation_dtype: float32
  boundary_conditions:
    tail_mask_required: true
    rank: 2
    k_dimensions_must_match: true
validation:
  rtol: 0.01
  atol: 0.01
  max_error_required: null
  shape_cases:
  - - 32
    - 8192
  - - 8192
    - 8192
  dtype_cases:
  - bfloat16
performance:
  metric: median_latency_ms
  warmup: 10
  repeats: 100
  num_trials: 3
  baseline_latency_ms: null
  baseline_source: official_reference_model
sketch:
  operator_category: matmul_like
  compute_pattern: matmul_basic
  parallel_axes:
  - m_tiles
  - n_tiles
  - k_reduction_tiles
  axis_map:
    M:
      source: a
      axis: 0
      extent: 32
    K:
      lhs:
        source: a
        axis: 1
        extent: 8192
      rhs:
        source: b
        axis: 0
        extent: 8192
    N:
      source: b
      axis: 1
      extent: 8192
    output:
      shape:
      - 32
      - 8192
      dtype: bfloat16
  tile_plan:
    strategy: blocked_mnk_matmul
    shape:
    - 32
    - 8192
    - 8192
    tunable: true
    axes:
    - M
    - N
    - K
    initial_candidates:
    - block_m: 16
      block_n: 64
      block_k: 64
    - block_m: 32
      block_n: 64
      block_k: 64
    - block_m: 16
      block_n: 128
      block_k: 64
  memory_plan:
    inputs:
    - a
    - b
    input: a_b_global_read_with_blocked_k_reuse
    output: contiguous_global_write
    intermediate: float32_accumulator_tile
    a_tile: GM_to_local_tile[M,K]
    b_tile: GM_to_local_tile[K,N]
    bias: none
  pipeline_plan:
    stages:
    - load_a_tile
    - load_b_tile
    - dot_accumulate
    - store
  boundary_mask:
    required: true
    reason: M/N/K dimensions may not divide backend tile sizes
  accumulation_dtype: float32
  backend_target: triton_ascend
  performance_knobs:
    block_m: null
    block_n: null
    block_k: null
    num_warps_or_cores: null
    use_matmul_intrinsic: null
    accumulator_tile_limit: must fit UB/L1 budget
  known_risks:
  - bf16_input_accumulation_accuracy
  - large_k_dimension_tiling
  - matmul_backend_selection
  - tail_mask_correctness
  shape_symbols:
    M: 32
    N: 8192
    K: 8192
  dtype_plan:
    lhs: bfloat16
    rhs: bfloat16
    bias: null
    accumulator: float32
    output: bfloat16
  lowering_preference:
  - prefer_backend_matmul_or_dot_intrinsic_when_available
  - fall_back_to_blocked_k_loop_only_for_small_validation_or_debug
  output_dtype: bfloat16
submission:
  required_files:
  - t1/matmul_basic.py
  entrypoint: ModelNew
