id: t3/decode_mla
name: decode_mla
tier: t3
category: matmul_like
source_path: third_party/akg/akg_agents/benchmark/akg_kernels_bench_lite/t3/decode_mla.py
reference_class: Model
candidate_class: ModelNew
inputs:
- name: q
  shape:
  - 16
  - 128
  - 576
  dtype: float32
  layout: contiguous
- name: k_nope_buffer
  shape:
  - 128
  - 128
  - 1
  - 512
  dtype: float32
  layout: contiguous
- name: k_rope_buffer
  shape:
  - 128
  - 128
  - 1
  - 64
  dtype: float32
  layout: contiguous
- name: v_buffer
  shape:
  - 128
  - 128
  - 1
  - 512
  dtype: float32
  layout: contiguous
- name: seq_lens
  shape:
  - 16
  dtype: int32
  layout: contiguous
- name: block_table
  shape:
  - 16
  - 8
  dtype: int32
  layout: contiguous
outputs:
- name: output
  shape:
  - 16
  - 128
  - 512
  dtype: float32
  layout: contiguous
semantics:
  expression: torch.cat(outputs, dim=0)
  formula: softmax(((q_nope @ k_nope.T) + (q_rope @ k_rope.T)) * sm_scale) @ v
  broadcast: KV heads repeat across query heads when num_q_heads != num_kv_heads
  reduction_axes:
  - qk_nope_dim
  - qk_rope_dim
  - kv_sequence
  normalization_axes:
  - kv_sequence
  layout_transform: paged_kv_cache_gather
  sm_scale: 0.041666666666666664
  page_size: 128
  boundary_conditions:
    variable_sequence_lengths: true
    block_table_pages: true
    tail_mask_required: true
validation:
  rtol: 0.01
  atol: 0.01
  max_error_required: null
  shape_cases:
  - - 16
    - 128
    - 576
  - - 128
    - 128
    - 1
    - 512
  - - 128
    - 128
    - 1
    - 64
  - - 128
    - 128
    - 1
    - 512
  - - 16
  - - 16
    - 8
  dtype_cases:
  - float32
  - int32
performance:
  metric: median_latency_ms
  warmup: 10
  repeats: 100
  num_trials: 3
  baseline_latency_ms: null
  baseline_source: official_reference_model
sketch:
  operator_category: matmul_like
  compute_pattern: paged_mla_decode_attention
  parallel_axes:
  - batch
  - query_heads
  - kv_sequence
  - value_dim
  tile_plan:
    strategy: paged_qk_softmax_value_pipeline
    shape:
    - 16
    - 128
    - 1024
    - 512
    tunable: true
  memory_plan:
    inputs:
    - q
    - k_nope_buffer
    - k_rope_buffer
    - v_buffer
    - seq_lens
    - block_table
    input: paged_kv_cache_gather_with_block_table
    output: contiguous_attention_output_write
    intermediate: qk_scores_and_softmax_accumulators
  pipeline_plan:
    stages:
    - gather_kv_pages
    - split_q_nope_rope
    - qk_nope_matmul
    - qk_rope_matmul
    - scale_softmax
    - value_matmul
    - store
  boundary_mask:
    required: true
    reason: sequence lengths and page counts vary per batch
  accumulation_dtype: float32
  backend_target: triton_ascend
  performance_knobs:
    head_tile: null
    sequence_tile: null
    value_tile: null
    page_tile: null
    num_warps_or_cores: null
  known_risks:
  - paged_cache_block_table_mapping
  - variable_sequence_length_masks
  - gqa_head_repetition
  - softmax_numerical_stability
  - large_intermediate_qk_storage
  - matmul_backend_selection
  - qk_total_dim_576_split_512_64
  - v_buffer_dtype_float32
submission:
