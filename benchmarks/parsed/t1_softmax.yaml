id: t1/softmax
name: softmax
tier: t1
category: reduction
source_path: third_party/akg/akg_agents/benchmark/akg_kernels_bench_lite/t1/softmax.py
reference_class: Model
candidate_class: ModelNew
inputs:
- name: input_tensor
  shape:
  - 32
  - 512
  - 4096
  dtype: float32
  layout: contiguous
outputs:
- name: output
  shape:
  - 32
  - 512
  - 4096
  dtype: float32
  layout: contiguous
semantics:
  expression: torch.softmax(input_tensor, dim=self.dim)
  formula: exp(x - max(x, dim)) / sum(exp(x - max(x, dim)), dim)
  broadcast: none
  reduction_axes:
  - -1
  normalization_axes:
  - -1
  layout_transform: none
  boundary_conditions:
    tail_mask_required: true
validation:
  rtol: 0.01
  atol: 0.01
  max_error_required: null
  shape_cases:
  - - 32
    - 512
    - 4096
  dtype_cases:
  - float32
performance:
  metric: median_latency_ms
  warmup: 10
  repeats: 100
  num_trials: 3
  baseline_latency_ms: null
  baseline_source: official_reference_model
sketch:
  operator_category: reduction
  compute_pattern: rowwise_softmax
  parallel_axes:
  - outer_rows
  tile_plan:
    strategy: rowwise_last_dim_tiling
    shape:
    - 16384
    - 4096
    tunable: true
  memory_plan:
    inputs:
    - input_tensor
    input: row_contiguous_global_read
    output: contiguous_global_write
    intermediate: local_vector_reduction
  pipeline_plan:
    stages:
    - load_row
    - max_reduce
    - exp
    - sum_reduce
    - normalize
    - store
  boundary_mask:
    required: true
    reason: row count or reduction width may not align with backend tile size
  accumulation_dtype: float32
  backend_target: triton_ascend
  performance_knobs:
    row_tile: null
    reduction_tile: null
    num_warps_or_cores: null
  known_risks:
  - max_subtraction_numerical_stability
  - reduction_accuracy
  - row_boundary_mapping
submission:
  required_files:
  - t1/softmax.py
  entrypoint: ModelNew
